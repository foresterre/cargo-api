[workspace]
members = ["cargo-api-cli", "cargo-api-core"]

[workspace.package]
version = "0.3.0"
authors = ["Martijn Gribnau <garm@ilumeo.com>"]
repository = "https://github.com/foresterre/cargo-api"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cargo-api-core = { version = "0.3.0", path = "cargo-api-core" }
anyhow = "1.0.86"
semver = "1.0.23"
serde_json = "1.0.127"

[package]
name = "cargo-api"
description = "Consists of a `cargo api` CLI and HTTP client library for crates.io's API"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cargo-api"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
cargo-api-core.workspace = true
cargo-api-cli = { version = "0.3.0", path = "cargo-api-cli", optional = true }
anyhow = { workspace = true, optional = true }

[features]
default = ["cli"]
# The `cargo api` binary
cli = ["dep:cargo-api-cli", "dep:anyhow"]
# Endpoints deprecated by crates.io
deprecated = ["cargo-api-core/deprecated", "cargo-api-cli?/deprecated"]
